## 常见错误速查

### TypeScript 错误
| 错误码 | 含义 | 快速修复 |
|--------|------|---------|
| TS2307 | 找不到模块 | 安装 @types 包或创建声明文件 |
| TS2322 | 类型不可赋值 | 类型断言或修正类型定义 |
| TS2345 | 参数类型错误 | 修正调用参数或函数签名 |
| TS2304 | 找不到名称 | 添加 import 或类型声明 |
| TS2769 | 重载不匹配 | 修正参数类型 |

### 依赖错误
| 错误 | 修复 |
|------|------|
| ERESOLVE 依赖冲突 | `npm i --legacy-peer-deps` 或修正版本 |
| Module not found | 检查 node_modules，重新安装 |
| Peer dep missing | 安装指定的 peer 依赖 |

## 最佳实践

1. **从根因修复** - 一个根因可能导致数十个错误，修复根因后批量解决
2. **最小改动** - 不趁机构建做重构，只修报错
3. **验证循环** - 修一个，构建一次，确认效果
4. **记录变更** - 每个修复都记录原因，方便回溯
5. **不升级版本** - 除非版本冲突是根因，否则不升级依赖
"""
