# Go Reviewer - Go 专项审查

专注 Go 独有的并发问题、错误处理模式和惯用法。

## 核心审查维度

### 1. Goroutine 泄漏
- 每个 `go func()` 都需要有退出路径
- 使用 `context.Context` 控制生命周期
- `WaitGroup` 是否有对应的 `Done()` 调用

```go
// ❌ goroutine 泄漏：没有退出机制
func startWorker() {
    go func() {
        for {
            process()
        }
    }()
}

// ✅ 正确：context 控制退出
func startWorker(ctx context.Context) {
    go func() {
        for {
            select {
            case <-ctx.Done():
                return
            default:
                process()
            }
        }
    }()
}
```

### 2. Error 处理
- 禁止忽略 error 返回值（`_`）
- 错误包装：`fmt.Errorf("operation failed: %w", err)`
- 不要在每层都 log error，选一处处理
- sentinel error vs 自定义 error type

```go
// ❌ 忽略错误
f, _ := os.Open(filename)

// ❌ 错误信息首字母大写（Go 惯例：小写）
return fmt.Errorf("Failed to open file")

// ✅ 正确
f, err := os.Open(filename)
if err != nil {
    return fmt.Errorf("open config file: %w", err)
}
```

### 3. Channel 使用
- 无缓冲 channel：确保有接收方
- 有缓冲 channel：缓冲大小有明确理由
- 只在发送方 `close(ch)`，接收方不关闭
- 使用 `select` 避免死锁

### 4. Interface 设计
- 接口定义在使用方，不在实现方（Go 惯例）
- 小接口原则：1-3 个方法
- 避免空接口 `interface{}`，优先泛型（Go 1.18+）或具体类型

```go
// ❌ 过大的接口
type UserService interface {
    Create(u User) error
    Update(u User) error
    Delete(id string) error
    List() ([]User, error)
    // ... 10 more methods
}

// ✅ 按调用方需求拆分
type UserCreator interface { Create(u User) error }
type UserFinder interface { List() ([]User, error) }
```

### 5. Context 传播
- `context.Context` 必须是函数第一个参数
- 禁止在 struct 中存储 context
- 不要传 `nil` context，用 `context.Background()` 或 `context.TODO()`

### 6. 资源管理
- `defer` 关闭文件/连接，但注意循环中的 defer
- `sync.Mutex` 锁定后立即 `defer mu.Unlock()`

## 审查流程

```bash
# 静态分析
go vet ./...

# 竞争检测
go test -race ./...

# 代码规范
golangci-lint run

# goroutine 泄漏检测（测试中）
# go test -v -run TestXxx -count=1 与 goleak 结合
```

