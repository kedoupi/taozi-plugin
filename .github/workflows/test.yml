name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 运行测试
        run: node tests/run-all.js

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 验证 JSON 文件
        run: |
          # hooks.json 必须是有效 JSON
          node -e "JSON.parse(require('fs').readFileSync('hooks/hooks.json', 'utf8'))"
          echo "✓ hooks.json 格式正确"

          # plugin.json 必须是有效 JSON
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json', 'utf8'))"
          echo "✓ plugin.json 格式正确"

      - name: 验证文件结构
        run: |
          # 所有 agents 必须有 .md 文件
          for f in agents/*.md; do
            [ -f "$f" ] && echo "✓ Agent: $f" || { echo "✗ 缺少: $f"; exit 1; }
          done

          # 所有 skills 必须有 SKILL.md
          for d in skills/*/; do
            [ -f "$d/SKILL.md" ] && echo "✓ Skill: $d" || { echo "✗ 缺少: $d/SKILL.md"; exit 1; }
          done

          # 所有 rules 必须有内容
          for f in rules/*.md; do
            size=$(wc -c < "$f")
            [ "$size" -gt 50 ] && echo "✓ Rule: $f ($size bytes)" || { echo "✗ Rule 太短: $f"; exit 1; }
          done

          # 所有 hook 脚本必须存在
          for f in scripts/hooks/*.js; do
            [ -f "$f" ] && echo "✓ Hook script: $f" || { echo "✗ 缺少: $f"; exit 1; }
          done

      - name: 验证 shell 脚本
        run: |
          found=0
          for f in scripts/*.sh; do
            [ -f "$f" ] || continue
            found=1
            bash -n "$f" && echo "✓ $f 语法正确" || { echo "✗ $f 语法错误"; exit 1; }
          done

          [ "$found" -eq 1 ] || { echo "✗ 未找到 shell 脚本"; exit 1; }

      - name: 验证 bump-version 实际可执行（dry-run）
        run: |
          # 用一个一定大于当前版本的目标跑 dry-run，验证跨平台可执行。
          node scripts/bump-version.js --dry-run 999.0.0 > /tmp/bump.log 2>&1 || { cat /tmp/bump.log; exit 1; }
          grep -q "DRY-RUN 模式" /tmp/bump.log || { cat /tmp/bump.log; exit 1; }
          echo "✓ bump-version.js dry-run 可执行"

      - name: 验证 npm pack 产物干净（无 __pycache__）
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.log | head -40
          if grep -E '(__pycache__|\.pyc|\.DS_Store)' /tmp/pack.log; then
            echo "✗ npm pack 产物中包含不应发布的文件"
            exit 1
          fi
          echo "✓ npm pack 产物干净"

      - name: 验证 README catalog 与源文件一致
        run: |
          node scripts/sync-codex.js --check
          echo "✓ README catalog 已同步"
