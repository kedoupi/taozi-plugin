name: "sspai"
description: "少数派风格：暖白底红色点缀，清爽文艺，适合数码生活和效率工具内容"
colors:
  primary: "#c7372f"
  secondary: "#d4524b"
  text: "#333333"
  text_light: "#888888"
  background: "#fafaf7"
  code_bg: "#f5f2ed"
  code_color: "#c7372f"
  quote_border: "#c7372f"
  quote_bg: "#fdf5f4"
  border_radius: "6px"
  darkmode:
    background: "#1c1c1a"
    text: "#e0ddd8"
    primary: "#e05a52"
    code_bg: "#2a2825"
    code_color: "#e87c76"
    quote_bg: "#2a2220"
    quote_border: "#e05a52"
base_css: |
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 16px; line-height: 1.85; color: #333333; background: #fafaf7; }
  h2 { font-size: 21px; font-weight: 700; color: #c7372f; padding-bottom: 8px; border-bottom: 2px solid #c7372f; margin: 30px 0 14px; }
  h3 { font-size: 18px; font-weight: 600; color: #333333; padding-left: 10px; border-left: 3px solid #c7372f; margin: 24px 0 12px; }
  p { margin: 14px 0; }
  strong { color: #c7372f; font-weight: 700; }
  code { background: #f5f2ed; color: #c7372f; padding: 2px 6px; border-radius: 4px; font-size: 14px; }
  pre { background: #f5f2ed; padding: 16px; border-radius: 6px; overflow-x: auto; margin: 16px 0; border: 1px solid #e8e4dc; }
  blockquote { border-left: 4px solid #c7372f; background: #fdf5f4; padding: 12px 16px; margin: 16px 0; border-radius: 0 6px 6px 0; color: #555555; }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; }
  th { background: #c7372f; color: #ffffff; padding: 10px 14px; font-weight: 600; border: 1px solid #c7372f; }
  td { padding: 10px 14px; border: 1px solid #e8e4dc; }
  a { color: #c7372f; font-weight: 500; }
  hr { border: none; border-top: 1px solid #e8e4dc; margin: 28px 0; }
