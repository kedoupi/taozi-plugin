name: "minimal"
description: "极简黑白灰风格，无色彩干扰，内容至上"
colors:
  primary: "#333333"
  secondary: "#666666"
  text: "#333333"
  text_light: "#666666"
  background: "#ffffff"
  code_bg: "#f5f5f5"
  code_color: "#d73a49"
  quote_border: "#cccccc"
  quote_bg: "#f9f9f9"
  border_radius: "4px"
  darkmode:
    background: "#1a1a1a"
    text: "#c0c0c0"
    primary: "#e0e0e0"
    code_bg: "#252525"
    code_color: "#c0c0c0"
    quote_bg: "#222222"
    quote_border: "#555555"
base_css: |
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 16px; line-height: 1.8; color: #333333; }
  h2 { font-size: 22px; font-weight: 700; color: #1a1a1a; padding-bottom: 8px; border-bottom: 1px solid #e0e0e0; margin: 28px 0 14px; }
  h3 { font-size: 18px; font-weight: 600; color: #333333; margin: 24px 0 12px; }
  p { margin: 12px 0; }
  strong { color: #1a1a1a; font-weight: 700; }
  code { background: #f5f5f5; color: #d73a49; padding: 2px 6px; border-radius: 4px; font-size: 14px; }
  pre { background: #f5f5f5; padding: 16px; border-radius: 4px; overflow-x: auto; margin: 16px 0; border: 1px solid #e0e0e0; }
  blockquote { border-left: 3px solid #cccccc; background: #f9f9f9; padding: 12px 16px; margin: 16px 0; color: #666666; }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; }
  th { background: rgba(0,0,0,0.05); color: #333333; padding: 10px 14px; font-weight: 600; border: 1px solid #e0e0e0; }
  td { padding: 10px 14px; border: 1px solid #e0e0e0; }
  a { color: #333333; text-decoration: underline; }
  hr { border: none; border-top: 1px solid #e0e0e0; margin: 24px 0; }
