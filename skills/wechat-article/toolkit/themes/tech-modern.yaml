name: "tech-modern"
description: "科技感蓝紫渐变风格，适合技术和产品类内容"
colors:
  primary: "#7c3aed"
  secondary: "#3b82f6"
  text: "#333333"
  text_light: "#666666"
  background: "#ffffff"
  code_bg: "#282c34"
  code_color: "#abb2bf"
  quote_border: "#7c3aed"
  quote_bg: "#f8f5ff"
  border_radius: "8px"
  darkmode:
    background: "#1a1a2e"
    text: "#c8c8c8"
    primary: "#a78bfa"
    code_bg: "#1e1e2e"
    code_color: "#c8cad8"
    quote_bg: "#232340"
    quote_border: "#7c3aed"
base_css: |
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 16px; line-height: 1.8; color: #333333; }
  h2 { font-size: 22px; font-weight: 700; color: #1a1a1a; padding-bottom: 10px; border-bottom: 2px solid #7c3aed; margin: 28px 0 14px; }
  h3 { font-size: 18px; font-weight: 600; color: #333333; padding-left: 12px; border-left: 3px solid #7c3aed; margin: 24px 0 12px; }
  p { margin: 12px 0; }
  strong { color: #7c3aed; font-weight: 700; }
  code { background: #f5f5f5; color: #e83e8c; padding: 2px 6px; border-radius: 4px; font-size: 14px; }
  pre { background: #282c34; color: #abb2bf; padding: 16px; border-radius: 8px; overflow-x: auto; margin: 16px 0; }
  blockquote { border-left: 4px solid #7c3aed; background: #f8f5ff; padding: 12px 16px; margin: 16px 0; border-radius: 0 8px 8px 0; }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; }
  th { background: #7c3aed; color: #ffffff; padding: 10px 14px; font-weight: 600; border: 1px solid #7c3aed; }
  td { padding: 10px 14px; border: 1px solid #e5e7eb; }
  a { color: #7c3aed; font-weight: 500; }
  hr { border: none; border-top: 2px solid #7c3aed; margin: 24px 0; }
