name: "simple"
description: "微信标准蓝，通用简洁，适合大多数公众号内容"
colors:
  primary: "#576b95"
  secondary: "#576b95"
  text: "#333333"
  text_light: "#666666"
  background: "#ffffff"
  code_bg: "#f5f5f5"
  code_color: "#e83e8c"
  quote_border: "#576b95"
  quote_bg: "#f0f4fc"
  border_radius: "4px"
  darkmode:
    background: "#1a1a1a"
    text: "#c8c8c8"
    primary: "#7a92c4"
    code_bg: "#252525"
    code_color: "#c8c8c8"
    quote_bg: "#222233"
    quote_border: "#7a92c4"
base_css: |
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 16px; line-height: 1.8; color: #333333; }
  h2 { font-size: 20px; font-weight: 700; color: #576b95; padding-bottom: 6px; border-bottom: 2px solid #576b95; margin: 24px 0 12px; }
  h3 { font-size: 17px; font-weight: 600; color: #333333; padding-left: 10px; border-left: 3px solid #576b95; margin: 20px 0 10px; }
  p { margin: 12px 0; }
  strong { color: #576b95; font-weight: 700; }
  code { background: #f5f5f5; color: #e83e8c; padding: 2px 5px; border-radius: 3px; font-size: 14px; }
  pre { background: #f5f5f5; padding: 16px; border-radius: 4px; overflow-x: auto; margin: 16px 0; }
  blockquote { border-left: 4px solid #576b95; background: #f0f4fc; padding: 10px 16px; margin: 14px 0; border-radius: 0 4px 4px 0; }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; }
  th { background: #576b95; color: #ffffff; padding: 8px 12px; font-weight: 600; border: 1px solid #576b95; }
  td { padding: 8px 12px; border: 1px solid #d0d0d0; }
  tr:nth-child(even) { background: #f8faff; }
  a { color: #576b95; }
  hr { border: none; border-top: 1px solid #e0e0e0; margin: 20px 0; }
